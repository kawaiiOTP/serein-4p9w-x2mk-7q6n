<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Character Grid Maker</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Character Grid Maker</h1>
    <p>キャラクターを選んで、自由に並べて画像を作ろう。</p>
  </header>

  <main>
    <section class="panel">
      <h2>キャラクター選択</h2>
      <input
        type="search"
        id="searchInput"
        placeholder="キャラクター名で検索..."
      >
      <div id="characterList" class="character-list">
        読み込み中...
      </div>
    </section>

    <section class="panel">
      <h2>選択したキャラクター</h2>
      <div id="selectedList" class="selected-list"></div>

      <div class="settings">
        <label>
          列数
          <input type="number" id="columns" value="5" min="1" max="30">
        </label>

        <label>
          拡大率（%）
          <input type="number" id="scale" value="100" min="10" max="300">
        </label>
      </div>

      <button id="previewButton">プレビュー更新</button>
      <button id="downloadButton">PNGで保存</button>
    </section>

    <section class="panel">
      <h2>プレビュー</h2>
      <div id="previewArea">
        <canvas id="previewCanvas"></canvas>
      </div>
    </section>
  </main>

  <script src="script.js"></script>
</body>
</html>
